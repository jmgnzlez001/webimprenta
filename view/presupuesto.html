        <section class="contenido">
            <h1>Presupuesto</h1>
            <p>Materializa esas ideas y trae con nosotros la posibilidad de traer mas clientes a tu Negocio.</p>
            <h2>Contactanos</h2>
            <form class="contac-form">
                <label for="name">Nombre</label>
                <input type="text" id="name" placeholder="Nombre" required pattern="[A-Za-z\s]+" title="El nombre solo puede contener letras y espacios">

                <label for="correo">Correo Electronico</label>
                <input type="email" id="correo" placeholder="Correo Electronico" required   pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Ingrese un correo electrónico válido">

                <label for="telefono">Numero de Telefono</label>
                <input type="tel" id="telefono" placeholder="Numero de telefono" required pattern="[0-9]{9}" title="Ingrese un número de teléfono válido">

                <label for="mensaje">Mensaje:</label>
                <textarea name="mensaje" id="mensaje" rows="4" placeholder="Escriba su mensaje"></textarea>
                
                <div class="checkbox1">
                    <input type="checkbox" id="checkbox1" required >
                    <label for="checkbox1">Estoy de acuerdo acepto los terminos y condiciones </label>
                </div>
                <input type="submit" value="Enviar">
                
            </form>
        </section>
    </main>
